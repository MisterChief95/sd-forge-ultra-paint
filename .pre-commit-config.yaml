repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npm --prefix frontend exec -- prettier --write --ignore-unknown
        language: system
        files: ^frontend/
        exclude: ^frontend/(dist|node_modules|test-results)/
